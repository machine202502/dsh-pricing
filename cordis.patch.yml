- insert:
    - id: pricing
      name: '@machine202502/dsh-pricing'
      config:
        bridgePort: 49237
        refreshHours: 6
        sourceUrl: 'https://api-docs.deepseek.com/quick_start/pricing.md'
        # `deepseek-official` is the route DSH ships; `deepseek-account` is the
        # older id for the same account-backed provider. Both are accepted.
        officialProviders:
          - deepseek-official
          - deepseek-account
        models:
          - deepseek-flash
          - deepseek-v4-flash
          - deepseek-v4-pro
