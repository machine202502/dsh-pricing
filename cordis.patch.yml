- insert:
    - id: pricing
      name: '@machine202502/dsh-pricing'
      config:
        bridgePort: 49237
        refreshHours: 6
        sourceUrl: 'https://api-docs.deepseek.com/quick_start/pricing.md'
        # `deepseek-official` serves new sessions, `deepseek-account` the
        # signed-in account. Both are accepted.
        officialProviders:
          - deepseek-official
          - deepseek-account
        models:
          - deepseek-flash
          - deepseek-v4-flash
          - deepseek-v4-pro
